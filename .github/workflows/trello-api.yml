# run the trello api tests on every push and every pull request
# the gui tests stay in the other workflow file
# this file only runs the api challenge folder

name: Trello API tests

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:

permissions:
  contents: write

jobs:
  trello-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'API Challenge'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'API Challenge/package-lock.json'

      - name: Install packages
        run: npm ci

      - name: Run api tests
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
        run: npx playwright test

      - name: Create Allure report
        if: always()
        run: npx allure generate ./allure-results -o ./allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trello-api-allure-report
          path: 'API Challenge/allure-report'
          if-no-files-found: ignore

      - name: Publish Allure report to GitHub Pages
        if: always() && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: 'API Challenge/allure-report'
          destination_dir: trello-api-report
          keep_files: true
